{{ define "main" }}
  <div class="nerdy-page-surface nerdy-page-surface--home">
    <div class="nerdy-ambient-bg"></div>
    <div class="nerdy-top-glow"></div>

    <div class="nerdy-container flex min-h-[80vh] items-center justify-center py-16">
      <div class="w-full max-w-2xl">
        <div class="font-mono text-sm text-slate-900 dark:text-slate-100">
          <div class="overflow-hidden rounded-2xl border border-slate-300/90 bg-white/95 shadow-2xl shadow-slate-300/30 ring-1 ring-slate-900/10 backdrop-blur-md dark:border-slate-700/80 dark:bg-slate-950/95 dark:shadow-black/30 dark:ring-black/50">

            {{/* Title bar */}}
            <div class="flex h-10 shrink-0 items-center gap-2 border-b border-slate-300/90 bg-slate-100/95 px-4 dark:border-slate-700/80 dark:bg-slate-800">
              <div class="flex items-center gap-2">
                <div class="h-3.5 w-3.5 rounded-full border border-black/20 bg-[#ff5f56] shadow-sm"></div>
                <div class="h-3.5 w-3.5 rounded-full border border-black/20 bg-[#ffbd2e] shadow-sm"></div>
                <div class="h-3.5 w-3.5 rounded-full border border-black/20 bg-[#27c93f] shadow-sm"></div>
              </div>
              <div class="pointer-events-none absolute inset-x-0 text-center font-sans text-xs font-medium tracking-wide text-slate-600 dark:text-slate-400">
                jochen@portfolio:~ — 404
              </div>
            </div>

            {{/* Terminal body */}}
            <div class="p-6 md:p-8">
              <div class="mb-1">
                <span class="mr-2 font-bold">
                  <span class="text-slate-900 dark:text-slate-100">jochen@portfolio</span><span class="text-accent-cyan">~</span>
                  <span class="text-slate-900 dark:text-slate-100"> %</span>
                </span>
                <span class="text-slate-900 dark:text-slate-100">open {{ .RelPermalink }}</span>
              </div>

              <div class="mt-4 space-y-1 text-slate-700 dark:text-slate-300">
                <p><span class="text-red-500 dark:text-red-400">error:</span> no such file or directory</p>
                <p class="text-slate-500 dark:text-slate-400">exit status 404</p>
              </div>

              <div class="mt-8 border-t border-slate-200/80 pt-6 dark:border-slate-700/60">
                <p class="mb-4 text-slate-500 dark:text-slate-400">
                  The page you are looking for does not exist or has been moved.
                </p>
                <a
                  href="{{ "/" | relURL }}"
                  class="inline-flex items-center gap-2 rounded border border-slate-300 bg-white/80 px-3 py-1.5 font-mono text-xs font-bold uppercase tracking-wider text-slate-700 transition-colors hover:border-accent-cyan/40 hover:bg-white hover:text-accent-cyan dark:border-slate-600 dark:bg-slate-700/50 dark:text-slate-300 dark:hover:bg-slate-600"
                >
                  cd ~/home
                </a>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
{{ end }}
